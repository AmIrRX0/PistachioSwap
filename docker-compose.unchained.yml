name: pistachio-unchained

services:
  unchained-bnbsmartchain-api:
    image: pchained-local-node:0d9cf6682b329b2b14a8959400a25720a77247e0
    build:
      context: ./.unchained/Pchained/node
      dockerfile: Dockerfile.local
    container_name: pistachio-unchained-bnbsmartchain-api
    env_file:
      - ./.unchained/bnbsmartchain.env
    environment:
      PORT: "3000"
      ENVIRONMENT: local
      NETWORK: mainnet
      LOG_LEVEL: ${UNCHAINED_LOG_LEVEL:-info}
    working_dir: /app/node
    command: sh -c "yarn install && yarn build && cd coinstacks/bnbsmartchain/api && yarn run -T nodemon"
    volumes:
      - ./.unchained/Pchained:/app
    ports:
      - "127.0.0.1:3156:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
