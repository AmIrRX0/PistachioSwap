name: Repair fast-uri lockfile

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repair-fast-uri-lock.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Update vulnerable fast-uri overrides
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'package.json'
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'))
          pkg.pnpm ??= {}
          pkg.pnpm.overrides ??= {}
          pkg.pnpm.overrides['fast-uri@3.1.3'] = '3.1.5'
          pkg.pnpm.overrides['fast-uri@4.1.0'] = '4.1.2'
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`)
          NODE

      - name: Regenerate lockfile and install
        run: pnpm install --no-frozen-lockfile

      - name: Verify production audit
        run: pnpm audit --prod --audit-level=high

      - name: Commit repaired dependency resolution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add package.json pnpm-lock.yaml
          git diff --cached --quiet && {
            echo 'No dependency repair was necessary.'
            exit 0
          }

          git commit -m 'Patch fast-uri audit vulnerabilities'
          git push origin HEAD:main
