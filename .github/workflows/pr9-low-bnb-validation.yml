name: PR9 low-BNB validation

on:
  pull_request:
    paths:
      - '.github/workflows/pr9-low-bnb-validation.yml'
      - 'src/services/swapExecutionMode.js'
      - 'src/services/swapExecutionMode.test.js'
      - 'src/features/gas-assist/components/GasAssistBanner.jsx'
      - 'src/features/gas-assist/components/GasAssistBanner.test.jsx'
      - 'src/features/swap/components/TransactionStatus.jsx'
      - 'src/features/swap/components/TransactionStatus.test.jsx'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.3

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=high
      - name: Lint
        run: pnpm lint
      - name: API typecheck
        run: pnpm --filter @pistachio/api typecheck
      - name: Full unit suite
        run: pnpm test
      - name: Frontend build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm build
      - name: Third-party license audit
        run: pnpm licenses:audit
      - name: Public release tree audit
        run: pnpm audit:public-release-tree
      - name: Private Gas Assist boundary audit
        run: pnpm audit:private-gas-assist-boundary
